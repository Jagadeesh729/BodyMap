name: CI & Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static & Unit Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: TypeScript typecheck (app)
        run: npm run typecheck

      - name: TypeScript typecheck (node config)
        run: npx tsc -p tsconfig.node.json

      - name: TypeScript typecheck (e2e suite)
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Build production bundle (required by artifact oracle)
        run: npm run build

      - name: Unit & Oracle regression suite
        run: npm test -- --run

      - name: Dependency security audit
        run: npm audit --audit-level=high

  supply-chain:
    name: Supply-Chain Integrity Oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Build production bundle (required by artifact oracle)
        run: npm run build

      - name: Run supply-chain integrity oracle
        run: npx vitest run src/__tests__/productionSupplyChainIntegrityOracle.test.ts

  build-and-integrity:
    name: Production Build & Artifact Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify release artifact integrity
        run: node scripts/verify_artifact_integrity.mjs

  e2e-chromium:
    name: Tier 4 Browser E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Build production bundle for preview server
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E suite
        run: npx playwright test --project=chromium

      - name: Upload Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-chromium-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-webkit:
    name: Tier 4 Browser E2E (WebKit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Build production bundle for preview server
        run: npm run build

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit E2E suite
        run: npx playwright test --project=webkit

      - name: Upload WebKit failure artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-webkit-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-gate:
    name: Pre-Release Regression Gate (11/11 Checks)
    needs: [quality, supply-chain, build-and-integrity, e2e-chromium, e2e-webkit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Execute canonical release gate
        run: node scripts/release_gate.mjs
