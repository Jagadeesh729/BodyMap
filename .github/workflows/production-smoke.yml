name: Production Smoke Verification

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target production URL to verify'
        required: true
        default: 'https://bodymap-ai.vercel.app'

permissions:
  contents: read

jobs:
  smoke:
    name: Production Smoke Suite (Read-Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only production smoke tests
        env:
          BASE_URL: ${{ github.event.inputs.target_url }}
        run: npx playwright test e2e/production/ --project=chromium

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: production-smoke-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
