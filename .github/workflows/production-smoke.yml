name: Production Smoke Verification

on:
  deployment_status:
    types: [success]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Production Smoke Suite (Read-Only)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies (immutable lockfile)
        run: npm ci

      - name: Build certified artifact locally
        run: npm run build

      - name: Validate deployment provenance and production convergence
        env:
          DEPLOYMENT_SHA: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event_name == 'deployment_status' && github.event.deployment.environment || 'Production' }}
          DEPLOYMENT_STATUS: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state || 'success' }}
          DEPLOYMENT_REF: ${{ github.event_name == 'deployment_status' && github.event.deployment.ref || github.ref_name }}
          DEPLOYMENT_ID: ${{ github.event_name == 'deployment_status' && github.event.deployment.id || '' }}
          SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'deployment_status' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deployment_smoke_gate.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium production smoke
        env:
          BASE_URL: https://bodymap-ai.vercel.app
        run: npx playwright test e2e/production/ --project=chromium

      - name: Run WebKit production smoke
        env:
          BASE_URL: https://bodymap-ai.vercel.app
        run: npx playwright test e2e/production/ --project=webkit

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: production-smoke-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
