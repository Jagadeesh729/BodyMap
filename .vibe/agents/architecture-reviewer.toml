agent_type = "subagent"
display_name = "Architecture Reviewer"
description = "Maps system boundaries, reviews change impact levels against CHANGE_CONTROL.md, and formulates audit plans."
system_prompt_id = "architecture-reviewer"
safety = "strict"
auto_approve = false

disabled_tools = ["bash", "write_file", "edit_file", "web_search", "fetch_web_page"]

[tools.bash]
permission = "deny"

[tools.write_file]
permission = "deny"

[tools.edit_file]
permission = "deny"
